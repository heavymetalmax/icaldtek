name: 🔄 Update DTEK Calendar

on:
  # Розклад вимкнено 2026-10-18: публікують локальний cron (сервер, кожні 15 хв)
  # та icaldtek-fallback.yml (резерв, якщо сервер мовчить >60 хв).
  # Щоб повернути автозапуск кожні 10 хв — розкоментуй:
  # schedule:
  #   - cron: '*/10 * * * *'

  # Дозволити запуск вручну
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Завантажити код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📦 Встановити Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 💾 Кешувати Playwright браузери
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: 🔧 Встановити залежності
        run: npm ci
      
      - name: 🎭 Встановити Playwright браузери
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium chromium-headless-shell --with-deps
      
      - name: 🎬 Запустити скрипт
        run: node index.js
        # Скрипт сам керує git: комітить та пушить всі зміни
        # (dtek.ics, dtek-borshchahivka.ics, last_run_state.json)

      - name: 🔁 Commit & push generated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dtek.ics dtek-borshchahivka.ics last_run_state.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci): update generated calendars [skip ci]" || true
            # Ensure push uses the workflow token even if checkout didn't persist credentials
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📤 Завантажити календарі як артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtek-calendars
          path: |
            dtek.ics
            dtek-borshchahivka.ics
            last_run_state.json
          retention-days: 30
      
      - name: 📝 Показати результат
        run: |
          echo "✅ Календарі оновлено!"
          for f in dtek*.ics; do
            echo "$f: $(wc -c < $f) bytes, $(wc -l < $f) рядків"
          done
